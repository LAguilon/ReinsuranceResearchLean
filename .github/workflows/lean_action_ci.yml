name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with lean-action
        uses: leanprover/lean-action@v1
        with:
          auto-config: true
          build: true
          test: false
          lint: false

      - name: Zero-escape gate
        run: |
          set -euo pipefail
          if grep -rnE '\b(sorry|admit|native_decide)\b|^[[:space:]]*axiom[[:space:]]' \
               --include='*.lean' Research/; then
            echo "::error::Unproved step, compiler escape hatch, or custom axiom found"
            exit 1
          fi
          echo "no sorry / admit / native_decide / custom axiom in the library"

      - name: Verification harness (axiom footprint + non-vacuity)
        run: |
          set -euo pipefail
          lake env lean Research/Verify.lean > verify.out 2>&1
          cat verify.out
          if grep -q "sorryAx" verify.out; then
            echo "::error::sorryAx reached the kernel"
            exit 1
          fi
          if grep "depends on axioms" verify.out | grep -v "propext, Classical.choice, Quot.sound"; then
            echo "::error::unexpected axiom footprint"
            exit 1
          fi
          audited=$(grep -c "depends on axioms" verify.out)
          if [ "$audited" -lt 19 ]; then
            echo "::error::expected at least 19 audited theorems, found $audited"
            exit 1
          fi
          echo "axiom audit clean: $audited theorems, all on propext/Classical.choice/Quot.sound"
