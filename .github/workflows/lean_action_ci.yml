name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with lean-action
        uses: leanprover/lean-action@v1
        with:
          auto-config: true
          build: true
          test: false
          lint: false

      - name: Zero-sorry gate
        run: |
          set -euo pipefail
          if grep -rnE '\b(sorry|admit)\b|^[[:space:]]*axiom[[:space:]]' \
               --include='*.lean' Research/ Research.lean; then
            echo "::error::Unproved step or custom axiom found"
            exit 1
          fi
          echo "no sorry / admit / custom axiom in the library"
